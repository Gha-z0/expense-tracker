<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand mb-0 h1">Expense Tracker</span>
        </div>
    </nav>

    <main class="container py-4">
        <div id="alert-area"></div>

        <!-- Summary Cards -->
        <div class="summary-grid">
            <div class="card text-center">
                <div class="card-body">
                    <div class="text-muted">Total</div>
                    <div class="fs-3 fw-semibold" id="total-amount">0.00</div>
                </div>
            </div>
            <div class="card text-center">
                <div class="card-body">
                    <div class="text-muted">Expenses</div>
                    <div class="fs-3 fw-semibold" id="expense-count">0</div>
                </div>
            </div>
            <div class="card text-center">
                <div class="card-body">
                    <div class="text-muted">Highest</div>
                    <div class="fs-3 fw-semibold" id="highest-amount">0.00</div>
                </div>
            </div>
        </div>

        <!-- Forms -->
        <div class="card mb-4">
            <div class="card-body">
                <h2 class="h5 mb-3">Add expense</h2>
                <form id="expense-form" novalidate>
                    <div class="row g-3">
                        <div class="col-12 col-md-4">
                            <label for="title" class="form-label">Title</label>
                            <input type="text" class="form-control" id="title" name="title" maxlength="100">
                            <div class="invalid-feedback" id="title-error"></div>
                        </div>
                        <div class="col-6 col-md-2">
                            <label for="amount" class="form-label">Amount</label>
                            <input type="number" class="form-control" id="amount" name="amount" step="0.01">
                            <div class="invalid-feedback" id="amount-error"></div>
                        </div>
                        <div class="col-6 col-md-2">
                            <label for="category" class="form-label">Category</label>
                            <select class="form-select" id="category" name="category">
                                <option value="">Choose...</option>
                                <option>Food</option>
                                <option>Transport</option>
                                <option>Bills</option>
                                <option>Entertainment</option>
                                <option>Other</option>
                            </select>
                            <div class="invalid-feedback" id="category-error"></div>
                        </div>
                        <div class="col-12 col-md-2">
                            <label for="date" class="form-label">Date</label>
                            <input type="date" class="form-control" id="date" name="date">
                            <div class="invalid-feedback" id="date-error"></div>
                        </div>
                        <div class="col-12 col-md-2 d-flex align-items-end">
                            <button type="submit" class="btn btn-primary w-100">Add</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- Table -->
        <div class="card">
            <div class="card-body">
                <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
                    <h2 class="h5 mb-0">Expenses</h2>
                    <div class="d-flex flex-wrap gap-2">
                        <input type="search" id="search-title" class="form-control w-auto" placeholder="Search title..."
                            aria-label="Search by title">
                        <select id="filter-category" class="form-select w-auto" aria-label="Filter by category">
                            <option value="">All</option>
                            <option>Food</option>
                            <option>Transport</option>
                            <option>Bills</option>
                            <option>Entertainment</option>
                            <option>Other</option>
                        </select>
                        <button type="button" id="export-csv" class="btn btn-outline-secondary">Export CSV</button>
                    </div>
                </div>
                <div id="spinner" class="text-center py-4 d-none">
                    <div class="spinner-border" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th class="sortable" data-sort="title">Title</th>
                                <th class="sortable" data-sort="amount">Amount</th>
                                <th class="sortable" data-sort="category">Category</th>
                                <th class="sortable" data-sort="date">Date</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="expense-body"></tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <div class="modal fade" id="edit-modal" tabindex="-1" aria-labelledby="edit-modal-title" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="edit-form" novalidate>
                    <div class="modal-header">
                        <h2 class="modal-title h5" id="edit-modal-title">Edit expense</h2>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div id="edit-alert-area"></div>
                        <div class="mb-3">
                            <label for="edit-title" class="form-label">Title</label>
                            <input type="text" class="form-control" id="edit-title" name="title" maxlength="100">
                            <div class="invalid-feedback" id="edit-title-error"></div>
                        </div>
                        <div class="mb-3">
                            <label for="edit-amount" class="form-label">Amount</label>
                            <input type="number" class="form-control" id="edit-amount" name="amount" step="0.01">
                            <div class="invalid-feedback" id="edit-amount-error"></div>
                        </div>
                        <div class="mb-3">
                            <label for="edit-category" class="form-label">Category</label>
                            <select class="form-select" id="edit-category" name="category">
                                <option value="">Choose...</option>
                                <option>Food</option>
                                <option>Transport</option>
                                <option>Bills</option>
                                <option>Entertainment</option>
                                <option>Other</option>
                            </select>
                            <div class="invalid-feedback" id="edit-category-error"></div>
                        </div>
                        <div class="mb-3">
                            <label for="edit-date" class="form-label">Date</label>
                            <input type="date" class="form-control" id="edit-date" name="date">
                            <div class="invalid-feedback" id="edit-date-error"></div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
